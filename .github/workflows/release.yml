name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify version and release channel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const tag = process.env.RELEASE_TAG;
          const prerelease = process.env.RELEASE_PRERELEASE === 'true';
          if (tag !== `v${pkg.version}` || lock.version !== pkg.version ||
              lock.packages[''].version !== pkg.version) {
            console.error(`Release tag/lockfile mismatch for ${pkg.version}: ${tag}`);
            process.exit(1);
          }
          if (prerelease !== pkg.version.includes('-')) {
            console.error('GitHub prerelease flag does not match the package version');
            process.exit(1);
          }
          if (!prerelease && pkg.publishConfig?.tag !== 'latest') {
            console.error('Stable releases must publish with npm tag latest');
            process.exit(1);
          }
          NODE

  publish:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const tag = process.env.RELEASE_TAG;
          if (tag !== `v${pkg.version}`) {
            console.error(`Release tag ${tag} does not match package version v${pkg.version}`);
            process.exit(1);
          }
          NODE

      - name: Check
        run: npm run check

      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'beta' || 'latest' }}
        run: npm publish --tag "$NPM_DIST_TAG" --access public --provenance --ignore-scripts
